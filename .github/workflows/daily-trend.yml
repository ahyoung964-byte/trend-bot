name: daily-trend

# 매일 아침 실행 (UTC 22:00 = KST 07:00).
# ⚠️ GitHub Actions 예약은 정각 보장이 아니라 "7시 전후"로 이해할 것.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run trend bot
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Generate HTML report
        run: python report_html.py && cp index.html index.html.bak || true && mv report_*.html index.html

      - name: Commit & push report
        run: |
          git config user.name "trend-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "report: $(date +'%Y-%m-%d')"
          git push
